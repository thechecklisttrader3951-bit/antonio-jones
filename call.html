<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Call Antonio Jones</title>
<style>
:root{color-scheme:dark;--ink:#0a1420;--ivory:#f2ece2;--mist:#a7b6c8;--amber:#f0ae55;--teal:#43c2b3}
html{background:var(--ink)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--ivory);
font:400 17px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:24px 20px;box-sizing:border-box}
main{width:100%;max-width:420px;display:grid;gap:16px;text-align:center}
.k{margin:0;color:var(--teal);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0;font-size:34px;line-height:1.1}
p{margin:0;color:var(--mist)}
.b{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:999px;background:var(--amber);
color:#1b1206;font-weight:700;font-size:19px;text-decoration:none;padding:0 24px}
.b:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.alt{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.alt a{color:var(--ivory);font-size:15px}
</style>
</head>
<body>
<main>
  <p class="k">Antonio Jones &middot; SDR / BDR</p>
  <h1>Calling Antonio&hellip;</h1>
  <p>Your phone is opening with my number ready to go.</p>
  <a class="b" id="go" href="tel:+12052694476">Call (205) 269-4476</a>
  <p class="alt"><a href="tel:+12052694476">Call</a> &middot; <a href="sms:+12052694476?&amp;body=Hi%20Antonio%2C%20">Text</a> &middot; <a href="mailto:antoniojones3951@gmail.com?subject=Quick%20chat">Email</a> &middot; <a href="https://calendly.com/antoniojones3951/quick-chat">Pick a time</a></p>
</main>
<script>
  // Open the phone app right away; the button above stays as a one-tap fallback.
  setTimeout(function () { window.location.href = document.getElementById('go').href; }, 80);
</script>
</body>
</html>
